<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Inicio - Encuesta</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="justify-center items-center min-h-screen">
      <div class="container mx-auto flex items-center justify-around">
        {% include "components/header.html" %}
      </div>
      <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">
          ¿Deseas realizar la encuesta de forma anónima?
        </h1>
        <form method="POST" action="{% url 'procesar_anonimo' %}" class="flex flex-col gap-4">
          {% csrf_token %}
          <button
            type="submit"
            name="anonimo"
            value="si"
            class="bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-xl"
          >
            Sí, anónima
          </button>
          <button
            type="submit"
            name="anonimo"
            value="no"
            class="bg-gray-300 hover:bg-gray-400 text-gray-900 py-2 rounded-xl"
          >
            No, quiero registrarme
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
