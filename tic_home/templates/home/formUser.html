<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Mi Aplicación</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="text-white">
    <div class="min-h-screen flex flex-col justify-center items-center px-4">

      <div class="container mx-auto flex items-center justify-around">
        {% include "components/header.html" %}
      </div>
      
      <!-- Contenedor principal -->
      <div class="bg-gray-800 shadow-lg rounded-2xl p-8 w-full max-w-lg">
        
        <h2 class="text-center text-2xl font-semibold text-blue-400 mb-6">
          Registro de Estudiante
        </h2>

        <form method="POST" action="{% url 'formUser' %}" class="space-y-6">
          {% csrf_token %}

          <div class="space-y-4">
            <!-- Nombre -->
            <div>
              <label
                for="first_name"
                class="block text-sm font-medium text-gray-300"
                >Nombre</label
              >
              <input
                type="text"
                name="first_name"
                id="first_name"
                required
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              />
            </div>

            <!-- Apellido -->
            <div>
              <label
                for="last_name"
                class="block text-sm font-medium text-gray-300"
                >Apellido</label
              >
              <input
                type="text"
                name="last_name"
                id="last_name"
                required
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              />
            </div>

            <!-- Cédula -->
            <div>
              <label for="ci" class="block text-sm font-medium text-gray-300"
                >Cédula</label
              >
              <input
                type="text"
                name="ci"
                id="ci"
                required
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              />
            </div>

            <!-- Ciclo -->
            <div>
              <label for="cycle" class="block text-sm font-medium text-gray-300"
                >Ciclo</label
              >
              <select
                name="cycle"
                id="cycle"
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              >
                {% for value, label in form.fields.cycle.choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Itinerario -->
            <div>
              <label
                for="itinerary"
                class="block text-sm font-medium text-gray-300"
                >Itinerario</label
              >
              <select
                name="itinerary"
                id="itinerary"
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              >
                {% for value, label in form.fields.itinerary.choices %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Correo Electrónico -->
            <div>
              <label for="email" class="block text-sm font-medium text-gray-300"
                >Correo Electrónico</label
              >
              <input
                type="email"
                name="email"
                id="email"
                required
                class="mt-1 block w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-200"
              />
            </div>
          </div>

          <!-- Botones -->
          <div class="flex flex-col sm:flex-row gap-4">
            <button
              type="submit"
              class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transform hover:scale-[1.02] transition-all duration-200 text-lg"
            >
              Registrar
            </button>

          </div>
        </form>
      </div>
    </div>
  </body>
</html>
