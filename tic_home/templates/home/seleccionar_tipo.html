<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tipo de Experiencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="justify-center items-center min-h-screen">
      <div class="container mx-auto flex items-center justify-around">
        {% include "components/header.html" %}
      </div>
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md text-center">
        <h2 class="text-2xl font-bold mb-6">Selecciona el tipo de experiencia</h2>
        <form method="POST" action="{% url 'guardar_tipo_experiencia' %}" class="flex flex-col gap-4">
            {% csrf_token %}
            <button name="tipo" value="rv_no_inmersiva" class="bg-green-500 hover:bg-green-600 text-white py-2 rounded-xl">RV No Inmersiva</button>
            <button name="tipo" value="semi_inmersiva" class="bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded-xl">RV Semi-Inmersiva</button>
            <button name="tipo" value="inmersiva" class="bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-xl">RV Inmersiva</button>
        </form>
    </div>
</div>
</body>
</html>
