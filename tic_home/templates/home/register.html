{% extends "home/base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    {% include "components/header.html" %}
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Registro de Usuario</h2>

        <form id="registerForm" method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            
            <!-- Cédula de Identidad -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Cédula de Identidad</span>
                <input type="text" name="ci" id="ci" pattern="\d{10}" maxlength="10" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>

            </label>

            <!-- Nombre -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Nombre</span>
                <input type="text" name="first_name" id="first_name" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            </label>

            <!-- Apellido -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Apellido</span>
                <input type="text" name="last_name" id="last_name" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            </label>

            <!-- Ciclo -->
            <!-- Ciclo -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Ciclo</span>
                <input type="number" name="cycle" id="cycle" min="1" max="9" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            </label>

            <!-- Itinerario -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Itinerario</span>
                <input type="text" name="itinerary" id="itinerary" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            </label>

            <!-- Correo Electrónico -->
            <label class="block">
                <span class="text-gray-700 font-semibold">Correo Electrónico</span>
                <input type="email" name="email" id="email" class="w-full mt-1 p-2 border border-gray-300 rounded-md" required>
            </label>

            <!-- Botón de Enviar -->
            <!-- Botón de Enviar -->
<button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition">
    Registrar Usuario
</button>

        </form>

        <!-- Mensajes de error en frontend -->
        <p id="errorMessage" class="text-red-500 text-sm mt-2 hidden"></p>
    </div>

    <!-- Validación con JavaScript -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            const ci = document.getElementById('ci').value.trim();
            const email = document.getElementById('email').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            // Validar cédula (mínimo 10 caracteres)
            if (ci.length < 10) {
                event.preventDefault();
                errorMessage.textContent = "La cédula debe tener al menos 10 caracteres.";
                errorMessage.classList.remove('hidden');
                return;
            }

            // Validar correo (expresión regular básica)
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.match(emailPattern)) {
                event.preventDefault();
                errorMessage.textContent = "Por favor, ingrese un correo electrónico válido.";
                errorMessage.classList.remove('hidden');
                return;
            }

            errorMessage.classList.add('hidden');
        });
    </script>

</body>
</html>
{% endblock %}
