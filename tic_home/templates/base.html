<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aplicación de Encuestas{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Aplicar la fuente Inter como predeterminada */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    
    <div class="min-h-screen flex flex-col">
        <!-- Encabezado -->
        <header class="bg-white/80 backdrop-blur-lg shadow-sm sticky top-0 z-50">
            <nav class="container mx-auto px-4 sm:px-6 lg:px-8 bg-gray-800 p-2">
                <div class="flex items-center justify-between h-16">
                    <div class="flex-shrink-0">
                        <a href="{% url 'home' %}" class="text-2xl font-bold text-white">
                            InvestigaTEC
                        </a>
                    </div>
                    <div class="hidden md:block">
                        {% include "components/userPanel.html" %}
                    </div>
                </div>
            </nav>
        </header>

        <!-- Contenido Principal -->
        <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">
            {% block content %}
            <!-- El contenido de las páginas hijas irá aquí -->
            {% endblock %}
        </main>
    </div>
</body>
</html>
